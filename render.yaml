services:
  - type: web
    name: cars-dealership-api
    runtime: python
    plan: free
    buildCommand: cd server && pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput && python manage.py seed_demo_data
    startCommand: cd server && gunicorn djangoproj.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: cars-dealership-api.onrender.com
      - key: CORS_ALLOWED_ORIGIN_REGEXES
        value: ^https://cars-dealership-web(?:-[a-z0-9]+)?\.onrender\.com$
      - key: DATABASE_URL
        fromDatabase:
          name: cars-dealership-db
          property: connectionString

  - type: web
    name: cars-dealership-web
    runtime: static
    buildCommand: cd server/frontend && npm ci && npm run build
    staticPublishPath: server/frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cars-dealership-api.onrender.com/api

databases:
  - name: cars-dealership-db
    plan: free
    databaseName: dealership
    user: dealership
